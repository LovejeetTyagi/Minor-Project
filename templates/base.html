<!DOCTYPE html>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">

      <a class="brand" href="{{ url_for('home') }}">&#10084; HeartCheck</a>
